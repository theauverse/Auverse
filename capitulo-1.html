<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUVERSE | Capítulo 1</title>

  <style>
    body {
      margin: 0;
      background: #100919;
      color: #e0d5eb;
      font-family: Georgia, serif;
    }
body.claro {
  background: #f5effa;
  color: #30213b;
}

body.claro header {
  background: #e8dcf2;
}

body.claro header h1 {
  color: #713c91;
}

body.claro h2 {
  color: #49305f;
}

body.claro .volver {
  color: #713c91;
}
    header {
      text-align: center;
      padding: 25px;
      background: #1b1028;
    }

    header h1 {
      color: #d6aaff;
      letter-spacing: 4px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 2;
    }

    .volver {
      color: #d6aaff;
      text-decoration: none;
    }

    h2 {
      color: #fff;
      text-align: center;
      margin-top: 35px;
    }

    .texto {
      margin-top: 35px;
      font-size: 17px;
      white-space: pre-line;
    }

    .navegacion {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 50px;
    }

    .navegacion a {
      padding: 12px;
      background: #713c91;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AUVERSE</h1>
    <p>Cada historia merece su propio universo.</p>
  </header>

  <main>
<div style="text-align: right; margin-bottom: 20px;">
  <button onclick="document.body.classList.remove('claro')"
    style="padding: 10px; border-radius: 8px; background: #713c91; color: white; border: none;">
    🌙 Modo oscuro
  </button>

  <button onclick="document.body.classList.add('claro'); localStorage.setItem('auverse-tema', 'claro')"
    style="padding: 10px; border-radius: 8px; background: #e8dcf2; color: #24102f; border: none;">
    ☀️ Modo claro
  </button>
</div>
    <a class="volver" href="historia.html">
      ← Volver a la historia
    </a>

    <h2>Capítulo 1</h2>

    <div class="texto">
      <p>El comienzo de una nueva historia...</p>
    </div>

    <div class="navegacion">
      <a href="historia.html">← Volver</a>
      <a href="historia.html">Siguiente →</a>
    </div>

  </main>
<script>
  const temaGuardado = localStorage.getItem("auverse-tema");

  if (temaGuardado === "claro") {
    document.body.classList.add("claro");
  }
</script>
</body>
</html>
